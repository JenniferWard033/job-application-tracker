<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand-custom" href="/">Job Tracker</a>
        <div class="navbar-nav-custom d-none d-md-flex">
          <a class="nav-link-custom {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
          <a class="nav-link-custom {% if request.path.startswith('/companies') %}active{% endif %}" href="/companies">Companies</a>
          <a class="nav-link-custom {% if request.path.startswith('/jobs') %}active{% endif %}" href="/jobs">Jobs</a>
          <a class="nav-link-custom {% if request.path.startswith('/applications') %}active{% endif %}" href="/applications">Applications</a>
          <a class="nav-link-custom {% if request.path.startswith('/contacts') %}active{% endif %}" href="/contacts">Contacts</a>
          <a class="nav-link-custom {% if request.path.startswith('/job-match') %}active{% endif %}" href="/job-match">Job Match</a>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="navbar-icon-btn"><span class="material-symbols-outlined">notifications</span></button>
          <button class="navbar-icon-btn"><span class="material-symbols-outlined">settings</span></button>
        </div>
      </div>
    </nav>

    <div class="container-fluid px-4 mt-4 main-container">
      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
